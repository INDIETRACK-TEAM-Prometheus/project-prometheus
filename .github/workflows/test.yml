name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # one test runs the MPS CSV converter (standard library only)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # the HTTPS test fetches the built React page at /
      - run: npm run build:ui
      - run: npm test
