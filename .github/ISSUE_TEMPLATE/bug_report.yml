name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm start
        2. Open http://127.0.0.1:4173/?autostart
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console
      description: Remove API keys and personal data before pasting.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Node 22.9, Python 3.12, Chrome 140
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed API keys and dataset media from this report.
          required: true
